version: '3.8'

services:
  go-app:
    build:
      context: .
      target: final

    ports:
    - "1323:1323"

    depends_on:
      db:
        condition: service_healthy
  db: 
    image: postgres
    restart: always
    user: postgres

    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=new_password
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD","pg_isready"]
      interval: 10s
      timeout:  5s
      retries: 5
volumes:
  db-data: