apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculator-app-deployment
  labels:
    app: my-go-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-go-app
  template:
    metadata:
      labels:
        app: my-go-app
    spec:
     containers:
     -  name: calculator-go-container
        image: mughalaliahmad23/new_goimages
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: 1323
        livenessProbe:
          httpGet:
            path: /health
            port: 1323
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 15
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /readiness
            port: 1323
            scheme: HTTP
          initialDelaySeconds: 10
          timeoutSeconds: 1
     - name: calculator-postgres-container
       image: mughalaliahmad23/new_postgres
       imagePullPolicy: IfNotPresent
       ports:
         - containerPort: 5432
         
       livenessProbe:
          tcpSocket:
            port: 5432
          initialDelaySeconds: 30
          periodSeconds: 10
       readinessProbe:
         tcpSocket:
          port: 5432
         initialDelaySeconds: 10
         timeoutSeconds: 10 
---
apiVersion: v1
kind: Service
metadata:
  name: calculator-app-service
  labels:
     app: my-go-app
spec:
  selector:
    app: my-go-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 1323
      name: go-app-port
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  labels:
     app: my-go-app
spec:
  selector:
    app: my-go-app
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432